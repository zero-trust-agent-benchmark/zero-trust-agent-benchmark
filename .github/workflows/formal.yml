name: formal
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tlc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Download tla2tools
        run: |
          mkdir -p tools
          curl -fsSL -o tools/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "ab4694601923fd5ac06452abbf847c366a5054a3d739552085edd6ed986c29ec  tools/tla2tools.jar" | sha256sum -c -
      - run: TLA_JAR=tools/tla2tools.jar bash scripts/tlc.sh

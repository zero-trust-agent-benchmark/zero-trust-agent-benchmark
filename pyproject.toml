[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zero-trust-agent-benchmark"
version = "0.1.0"
description = "Zero Trust Agent Benchmark: a reproducible benchmark for zero-trust defenses of tool-using AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Parag Sawant" }]
keywords = ["ai-security", "zero-trust", "benchmark", "prompt-injection", "agents"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "jsonschema>=4.23",
  "httpx>=0.27",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-jsonschema>=4.23",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[project.scripts]
zero-trust-agent-benchmark = "zero_trust_agent_benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/zero-trust-agent-benchmark/zero-trust-agent-benchmark"
Issues = "https://github.com/zero-trust-agent-benchmark/zero-trust-agent-benchmark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zero_trust_agent_benchmark"]

[tool.hatch.build.targets.wheel.force-include]
"traces" = "zero_trust_agent_benchmark/_data/traces"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/zero_trust_agent_benchmark/stats.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]
"bench/**" = ["S311", "T201"]
"src/zero_trust_agent_benchmark/generator.py" = ["S311"]
"src/zero_trust_agent_benchmark/stats.py" = ["S311", "E231", "E501", "RUF022"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs external services (set RUN_INTEGRATION_TESTS=1)"]

[tool.coverage.run]
branch = true
source = ["zero_trust_agent_benchmark"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
